name: Vercel Portal Artifact

on:
  push:
    branches:
      - agent/academy-mastery-experience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:portal
      - uses: actions/upload-artifact@v4
        with:
          name: treinamento-atlasgr-portal-out
          path: apps/portal/out
          if-no-files-found: error
          retention-days: 1
