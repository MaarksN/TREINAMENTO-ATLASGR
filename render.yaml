# Render Blueprint Specification for AtlasGR LMS Monorepo
services:
  # 1. LMS Portal Frontend (Static Site on Render)
  - type: web
    name: treinamento-atlasgr-portal
    env: static
    buildCommand: npm install && npm run build --workspace=@atlasgr/portal
    staticPublishPath: ./apps/portal/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend Microservice API (NestJS Web Service)
  - type: web
    name: treinamento-atlasgr-api
    env: node
    buildCommand: npm install && npm run build --workspace=@atlasgr/api
    startCommand: npm run start --workspace=@atlasgr/api
    envVars:
      - key: PORT
        value: 3001
